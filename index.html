<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>避難所マップ - バージョン選択</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 800px;
            padding: 40px;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 50px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .cards {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        .card h2 {
            color: #667eea;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.8em;
        }
        .card .tech {
            color: #764ba2;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 15px;
        }
        .card .description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .card .features {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }
        .card .features li {
            color: #555;
            padding: 5px 0;
            padding-left: 20px;
            position: relative;
        }
        .card .features li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-top: 10px;
        }
        .badge.recommended {
            background: #4caf50;
            color: white;
        }
        .badge.classic {
            background: #ff9800;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ 指定避難所・避難場所マップ</h1>
        <div class="cards">
            <a href="index_tile.html" class="card">
                <h2>PMTiles版</h2>
                <div class="tech">PMTiles + MapLibre GL JS</div>
                <span class="badge recommended">推奨</span>
                <div class="description">
                    ベクタータイル形式で効率的にデータを配信。高速で軽量なマップ表示を実現します。
                </div>
                <ul class="features">
                    <li>高速読み込み</li>
                    <li>タイル形式で効率的</li>
                    <li>スムーズなズーム</li>
                    <li>施設名ラベル表示</li>
                </ul>
            </a>

            <a href="index_flatgeobuf.html" class="card">
                <h2>FlatGeobuf版</h2>
                <div class="tech">FlatGeobuf + MapLibre GL JS</div>
                <span class="badge classic">従来型</span>
                <div class="description">
                    表示領域に応じて動的にデータを読み込む方式。大容量データにも対応します。
                </div>
                <ul class="features">
                    <li>領域フィルタリング</li>
                    <li>動的データ読み込み</li>
                    <li>位置情報対応</li>
                    <li>施設名ラベル表示</li>
                </ul>
            </a>
        </div>
    </div>
</body>
</html>
